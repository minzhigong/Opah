spring:
  application:
    name: opah-server
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8787

opah:
  data-dir: ${OPAH_DATA_DIR:./data}
  secret-key: ${OPAH_SECRET_KEY:dev-only-secret-key-change-me}
  admin-password: ${OPAH_ADMIN_PASSWORD:opah-admin}

logging:
  level:
    com.opah: INFO
