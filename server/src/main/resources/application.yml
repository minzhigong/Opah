server:
  port: 8787

spring:
  application:
    name: opah
  datasource:
    url: jdbc:sqlite:${opah.data-dir:./data}/opah.db?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      connection-init-sql: PRAGMA busy_timeout=10000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

opah:
  data-dir: ./data
  build:
    concurrency: 2
  deploy:
    health-timeout-seconds: 30

logging:
  level:
    root: INFO
    com.opah: INFO
